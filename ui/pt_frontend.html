<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pipeline — Hospital Price Transparency | CMU–NIST AIMSEC</title>
<meta name="description" content="Step-by-step view of the price-transparency pipeline: retrieval, code validation and CMS machine-readable file pricing.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M16 7v18M7 16h18' stroke='white' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Hospital Price Transparency Agent — UI
   Minimal, single-accent, dark/light. No framework, no external assets.
   ───────────────────────────────────────────────────────────────────────── */

:root {
  color-scheme: light;

  --bg: #fbfbfa;
  --surface: #ffffff;
  --surface-2: #f5f5f4;
  --surface-3: #eeeeec;
  --border: #e4e4e1;
  --border-strong: #d2d2ce;
  --text: #17171a;
  --muted: #6d6d76;
  --faint: #9b9ba4;

  --accent: #0f766e;
  --accent-fg: #ffffff;
  --accent-soft: rgba(15, 118, 110, 0.09);
  --accent-line: rgba(15, 118, 110, 0.28);

  --ok: #15803d;
  --ok-soft: rgba(21, 128, 61, 0.09);
  --warn: #b45309;
  --warn-soft: rgba(180, 83, 9, 0.1);
  --err: #b91c1c;
  --err-soft: rgba(185, 28, 28, 0.08);

  --radius: 10px;
  --radius-sm: 7px;
  --maxw: 1200px;

  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
    "Liberation Mono", monospace;
}

[data-theme="dark"] {
  color-scheme: dark;

  --bg: #0b0b0d;
  --surface: #131315;
  --surface-2: #191919;
  --surface-3: #202024;
  --border: #26262b;
  --border-strong: #35353c;
  --text: #f1f1f3;
  --muted: #93939d;
  --faint: #6b6b74;

  --accent: #2dd4bf;
  --accent-fg: #06231f;
  --accent-soft: rgba(45, 212, 191, 0.1);
  --accent-line: rgba(45, 212, 191, 0.3);

  --ok: #4ade80;
  --ok-soft: rgba(74, 222, 128, 0.1);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.12);
  --err: #f87171;
  --err-soft: rgba(248, 113, 113, 0.12);
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  transition: background-color 0.18s ease, color 0.18s ease;
}

/* ── Typography ───────────────────────────────────────────────────────── */

h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.011em; }

h1 { font-size: 19px; line-height: 1.25; }
h2 { font-size: 14.5px; }
h3 { font-size: 13px; }
h4 { font-size: 12.5px; }

p { margin: 0 0 8px; }
p:last-child { margin-bottom: 0; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

code, .mono, .num {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

code {
  font-size: 0.92em;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 0.5px 4px;
}

.label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--faint);
}

.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* ── Shell ────────────────────────────────────────────────────────────── */

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 22px; }

header.top {
  border-bottom: 1px solid var(--border);
  /* Translucent so content is visible scrolling underneath, in whichever theme
     is active. This replaces a light/dark pair of rules whose specificity tied
     — both were (0,2,1), so the light one won on source order and the header
     stayed white in dark mode. */
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  position: sticky;
  top: 0;
  z-index: 40;
  backdrop-filter: saturate(180%) blur(12px);
}

.top-inner {
  display: flex;
  align-items: center;
  gap: 18px;
  min-height: 58px;
  padding: 9px 0;
}

.brand { display: flex; align-items: center; gap: 14px; }

.logos { display: flex; align-items: center; gap: 13px; }

.logos img { display: block; height: 20px; width: auto; }
.logos img.logo-cmu { height: 16px; }

.logos .sep {
  width: 1px;
  height: 24px;
  background: var(--border-strong);
  flex: none;
}

/* Exactly one variant of each mark is visible. These must out-specify
   `.logos img { display: block }` above, or light mode stacks all four. */
.logos img.logo-on-dark { display: none; }
[data-theme="dark"] .logos img.logo-on-light { display: none; }
[data-theme="dark"] .logos img.logo-on-dark { display: block; }

.title-block { display: flex; flex-direction: column; line-height: 1.3; }
.title-block .t { font-weight: 600; font-size: 13.5px; }
.title-block .s { font-size: 11px; color: var(--faint); }

.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 32px;
  min-width: 32px;
  padding: 0 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  font: inherit;
  font-size: 12px;
  transition: background 0.13s, color 0.13s, border-color 0.13s;
}

.icon-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-strong); }
.icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.icon-btn svg { width: 15px; height: 15px; }

/* ── Hero / query ─────────────────────────────────────────────────────── */

.hero { padding: 26px 0 4px; }

.hero .eyebrow {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 7px;
}

.hero h1 { font-size: 22px; margin-bottom: 6px; letter-spacing: -0.02em; }
.hero .lede { color: var(--muted); max-width: 74ch; margin: 0; font-size: 13.5px; }

.querybar {
  display: flex;
  gap: 8px;
  margin-top: 18px;
}

.querybar input[type="text"] {
  flex: 1;
  height: 40px;
  padding: 0 13px;
  font: inherit;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  transition: border-color 0.13s, box-shadow 0.13s;
}

.querybar input[type="text"]::placeholder { color: var(--faint); }

.querybar input[type="text"]:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  height: 40px;
  padding: 0 17px;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius);
  border: 1px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.13s, background 0.13s, border-color 0.13s;
}

.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { opacity: 0.88; }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-ghost {
  background: var(--surface);
  color: var(--muted);
  border-color: var(--border-strong);
}
.btn-ghost:hover { color: var(--text); background: var(--surface-2); }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

.btn svg { width: 14px; height: 14px; }

@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.85s linear infinite; }

.examples { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; align-items: center; }

.chip {
  font: inherit;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.13s;
}

.chip:hover { border-color: var(--accent-line); color: var(--accent); background: var(--accent-soft); }
.chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 500; }

/* ── Status strip ─────────────────────────────────────────────────────── */

.status {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-top: 18px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-2);
  font-size: 12px;
}

.status .grp { display: flex; align-items: center; gap: 7px; }
.status .sep { width: 1px; height: 14px; background: var(--border-strong); }
.status .val { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--text); font-weight: 500; }

.progress {
  flex: 1;
  min-width: 120px;
  height: 4px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
}

.progress > i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: 999px;
  transition: width 0.3s ease;
}

/* ── Badges ───────────────────────────────────────────────────────────── */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 2.5px 7px;
  border-radius: 5px;
  border: 1px solid transparent;
  white-space: nowrap;
}

.badge.live { color: var(--ok); background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 30%, transparent); }
.badge.demo { color: var(--warn); background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.badge.neutral { color: var(--muted); background: var(--surface-2); border-color: var(--border); }
.badge.accent { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-line); }

.dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

/* ── Layout ───────────────────────────────────────────────────────────── */

.layout {
  display: grid;
  grid-template-columns: 206px minmax(0, 1fr);
  gap: 30px;
  padding: 26px 0 70px;
  align-items: start;
}

@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; }
  .rail { display: none; }
}

.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }

/* ── Step rail ────────────────────────────────────────────────────────── */

.rail {
  position: sticky;
  top: 84px;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.rail .rail-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 0 0 9px 11px;
}

.rail-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 6px 9px 6px 11px;
  border-left: 2px solid var(--border);
  font-size: 12.5px;
  color: var(--muted);
  cursor: pointer;
  background: none;
  border-top: 0; border-right: 0; border-bottom: 0;
  font-family: inherit;
  text-align: left;
  width: 100%;
  transition: color 0.13s, border-color 0.13s, background 0.13s;
}

.rail-item:hover { color: var(--text); background: var(--surface-2); }

.rail-item .n {
  width: 17px;
  height: 17px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-family: var(--mono);
  background: var(--surface-3);
  color: var(--faint);
  flex: none;
}

.rail-item .secs { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

.rail-item.active { border-left-color: var(--accent); color: var(--text); font-weight: 500; }
.rail-item.active .n { background: var(--accent); color: var(--accent-fg); }
.rail-item.done { border-left-color: var(--ok); color: var(--text); }
.rail-item.done .n { background: var(--ok-soft); color: var(--ok); }
.rail-item.error { border-left-color: var(--err); color: var(--err); }

/* ── Cards ────────────────────────────────────────────────────────────── */

.card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
  scroll-margin-top: 82px;
}

.card > .card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 15px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}

.card-head .step-n {
  width: 20px; height: 20px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 10.5px;
  font-family: var(--mono);
  font-weight: 600;
  background: var(--surface-3);
  color: var(--muted);
  flex: none;
}

.card-head .head-meta { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--faint); }
.card-head .head-meta .t { font-family: var(--mono); }

.card-body { padding: 15px; }
.card-body.tight { padding: 0; }

.empty { color: var(--faint); font-size: 12.5px; padding: 3px 0; }

/* ── Entity chips ─────────────────────────────────────────────────────── */

.entities { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 11px; }

.entity {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 11px;
  background: var(--surface-2);
}

.entity .label { display: block; margin-bottom: 6px; }
.entity .vals { display: flex; flex-wrap: wrap; gap: 5px; }

.tag {
  font-size: 12px;
  padding: 2.5px 8px;
  border-radius: 5px;
  background: var(--surface);
  border: 1px solid var(--border-strong);
  color: var(--text);
}

.tag.accent { border-color: var(--accent-line); background: var(--accent-soft); color: var(--accent); }
.tag.none { color: var(--faint); border-style: dashed; }

/* ── Tables ───────────────────────────────────────────────────────────── */

.table-wrap { overflow-x: auto; max-width: 100%; }

table.grid {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}

table.grid th {
  text-align: left;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 8px 11px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;
}

table.grid th.sortable { cursor: pointer; user-select: none; }
table.grid th.sortable:hover { color: var(--text); }
table.grid th .arrow { opacity: 0.4; margin-left: 3px; }
table.grid th.sorted { color: var(--accent); }
table.grid th.sorted .arrow { opacity: 1; }

table.grid td {
  padding: 7px 11px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  color: var(--muted);
}

table.grid tbody tr:last-child td { border-bottom: 0; }
table.grid tbody tr:hover td { background: var(--surface-2); }
table.grid td.num { text-align: right; color: var(--text); font-family: var(--mono); font-size: 12px; }
table.grid td.code { font-family: var(--mono); color: var(--text); font-weight: 500; white-space: nowrap; }
table.grid td.strike { font-family: var(--mono); color: var(--err); text-decoration: line-through; white-space: nowrap; }

table.grid tr.best td { background: var(--accent-soft); }
table.grid tr.best td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
table.grid tr.best:hover td { background: var(--accent-soft); }

.scroll-box { max-height: 420px; overflow: auto; }

.cell-clip { display: inline-block; max-width: 32ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }

/* ── Score bar ────────────────────────────────────────────────────────── */

.scored { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }

.scored .bar {
  width: 44px; height: 3px;
  border-radius: 999px;
  background: var(--surface-3);
  overflow: hidden;
  flex: none;
}

.scored .bar > i { display: block; height: 100%; background: var(--accent); }

/* ── Answer ───────────────────────────────────────────────────────────── */

.answer { font-size: 13.5px; line-height: 1.65; color: var(--text); }
.answer h4 { margin: 14px 0 6px; }
.answer ul { margin: 8px 0; padding-left: 20px; }
.answer li { margin-bottom: 4px; }
.answer .ord { font-family: var(--mono); color: var(--faint); margin-right: 3px; }

details.disclosure {
  margin-top: 12px;
  border-top: 1px dashed var(--border);
  padding-top: 11px;
}

details.disclosure > summary {
  cursor: pointer;
  font-size: 11.5px;
  color: var(--muted);
  list-style: none;
  user-select: none;
}

details.disclosure > summary::-webkit-details-marker { display: none; }
details.disclosure > summary::before { content: "▸ "; color: var(--faint); }
details.disclosure[open] > summary::before { content: "▾ "; }
details.disclosure > summary:hover { color: var(--text); }

pre.raw {
  margin: 10px 0 0;
  padding: 11px 13px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.55;
  color: var(--muted);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 300px;
  overflow: auto;
}

/* ── Callout / filters ────────────────────────────────────────────────── */

.callout {
  display: flex;
  gap: 12px;
  padding: 11px 13px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--accent-line);
  background: var(--accent-soft);
  margin-bottom: 14px;
  font-size: 12.5px;
}

.callout .big { font-family: var(--mono); font-weight: 600; font-size: 15px; color: var(--accent); }

.filters { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 13px; }

.ferret {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  padding: 3px 8px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--muted);
}

.ferret .k { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.ferret .v { font-family: var(--mono); color: var(--text); }

/* ── Log ──────────────────────────────────────────────────────────────── */

.log {
  font-family: var(--mono);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--muted);
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  max-height: 190px;
  overflow: auto;
  white-space: pre-wrap;
  margin: 0;
}

/* ── Footer ───────────────────────────────────────────────────────────── */

footer.bot {
  border-top: 1px solid var(--border);
  padding: 20px 0 44px;
  color: var(--faint);
  font-size: 11.5px;
}

.foot-grid { display: flex; flex-wrap: wrap; gap: 10px 26px; align-items: baseline; }
.foot-grid .k { color: var(--faint); }
.foot-grid .v { color: var(--muted); font-family: var(--mono); }

.disclaimer {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
  max-width: 96ch;
  line-height: 1.6;
}

.toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--text);
  color: var(--bg);
  padding: 9px 15px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  z-index: 100;
}

.toast.show { opacity: 1; transform: translateY(0); }

.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

@media (max-width: 760px) {
  .title-block .s { display: none; }
  .top-inner { gap: 12px; }
}

@media print {
  header.top, .rail, .querybar, .examples, .icon-btn { display: none !important; }
  .layout { grid-template-columns: 1fr; }
  .card { break-inside: avoid; }
}

</style>
</head>
<body>
<div id="app"></div>
